[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-obs"
version = "0.1.0"
description = "Local-first evaluation and observability harness for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "agent-eval-obs contributors" }]
keywords = ["agent", "evaluation", "observability", "llm", "trajectory", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aeo = "aeo.cli:main"

[project.urls]
Homepage = "https://github.com/KDB1223/agent-eval-obs"
Repository = "https://github.com/KDB1223/agent-eval-obs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
