id: fizzbuzz
title: Implement fizzbuzz
category: coding
prompt: |
  Replace the body of fizzbuzz(n) in fizzbuzz.py.
  Return "FizzBuzz" when n is divisible by 15, "Fizz" when divisible by 3,
  "Buzz" when divisible by 5, and otherwise the decimal representation of n.
  Keep the function name and signature.
rubric: Multiples of 3 and 5 follow the usual word rules, and other integers are returned as text.
tools:
  - read_file
  - write_file
  - edit_file
max_steps: 8
files:
  fizzbuzz.py: |
    def fizzbuzz(n: int) -> str:
        raise NotImplementedError
  test_fizzbuzz.py: |
    from fizzbuzz import fizzbuzz

    def test_number():
        assert fizzbuzz(1) == "1"
        assert fizzbuzz(2) == "2"

    def test_fizz():
        assert fizzbuzz(3) == "Fizz"
        assert fizzbuzz(6) == "Fizz"

    def test_buzz():
        assert fizzbuzz(5) == "Buzz"
        assert fizzbuzz(10) == "Buzz"

    def test_fizzbuzz():
        assert fizzbuzz(15) == "FizzBuzz"
        assert fizzbuzz(30) == "FizzBuzz"
graders:
  - id: tests
    type: pytest
    path: test_fizzbuzz.py
    weight: 2
  - id: word
    type: contains
    target: file
    path: fizzbuzz.py
    value: FizzBuzz
  - id: wrote
    type: tool_any
    tools: [write_file, edit_file]
mock:
  - thought: I will read the stub before replacing it.
    tool: read_file
    arguments:
      path: fizzbuzz.py
  - thought: Write a single function that covers the four cases.
    tool: write_file
    arguments:
      path: fizzbuzz.py
      content: |
        def fizzbuzz(n: int) -> str:
            if n % 15 == 0:
                return "FizzBuzz"
            if n % 3 == 0:
                return "Fizz"
            if n % 5 == 0:
                return "Buzz"
            return str(n)
  - final: fizzbuzz() now returns Fizz, Buzz, FizzBuzz, or the number.
