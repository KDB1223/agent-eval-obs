# Coding task. The mock script is the offline agent; graders score the workspace it leaves behind.
id: fix-sum
title: Fix add() so it returns a sum
category: coding
prompt: |
  math_utils.py implements add() with subtraction. Change it so add(a, b)
  returns the sum of its arguments. Keep the function signature.
rubric: |
  The operator becomes addition, the signature stays add(a, b), and the
  final answer says that the function returns a sum.
tools:
  - read_file
  - edit_file
  - list_dir
max_steps: 8
timeout_s: 30
files:
  math_utils.py: |
    def add(a, b):
        return a - b
  test_math_utils.py: |
    from math_utils import add

    def test_positive():
        assert add(2, 3) == 5

    def test_negative():
        assert add(-1, 1) == 0
graders:
  - id: tests
    type: pytest
    path: test_math_utils.py
    weight: 2
  - id: operator
    type: contains
    target: file
    path: math_utils.py
    value: "return a + b"
  - id: signature
    type: regex
    target: file
    path: math_utils.py
    pattern: 'def add\(a, b\):'
  - id: explains
    type: contains
    target: answer
    value: sum
  - id: read-first
    type: tool_used
    tool: read_file
  - id: edited
    type: tool_used
    tool: edit_file
  - id: judge
    type: llm_judge
    required: false
    criteria: The edit is limited to the operator and the answer names the sum.
    threshold: 0.7
mock:
  - thought: I will read math_utils.py before changing it.
    tool: read_file
    arguments:
      path: math_utils.py
  - thought: The body subtracts. I will switch that operator to addition.
    tool: edit_file
    arguments:
      path: math_utils.py
      old: "return a - b"
      new: "return a + b"
  - thought: The signature is unchanged and the tests cover the sum.
    final: add() now returns the sum of its arguments.
